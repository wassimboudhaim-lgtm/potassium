<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Eye Gradient -->
    <linearGradient id="potassiumEyeGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="25%" stop-color="#00f5d4" />
      <stop offset="55%" stop-color="#00d4ff" />
      <stop offset="78%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Top Lid Gradient: Emerald Green to Vibrant Cyan -->
    <linearGradient id="topLidGrad" x1="15%" y1="65%" x2="85%" y2="50%">
      <stop offset="0%" stop-color="#00e887" />
      <stop offset="22%" stop-color="#00f5a0" />
      <stop offset="55%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Spiral & Lower Lid Gradient: Electric Cyan to Vivid Royal Blue -->
    <linearGradient id="spiralGrad" x1="90%" y1="45%" x2="40%" y2="55%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="35%" stop-color="#00b4ff" />
      <stop offset="68%" stop-color="#0077ff" />
      <stop offset="92%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#003cd6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" opacity="0.4" />
        <feMergeNode in="blur1" opacity="0.6" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" fill="#000000" rx="40" />

  <g filter="url(#eyeGlow)">
    <!-- Top Arc Path: Starts from lower left tail, forms left corner, arches across the top, meets right corner -->
    <path
      d="M 124 308
         L 96 262
         C 155 174 240 156 345 180
         C 376 187 403 216 426 262"
      fill="none"
      stroke="url(#topLidGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower Lid and Inner Iris Spiral -->
    <path
      d="M 426 262
         C 400 312 345 362 256 362
         C 192 362 166 318 166 268
         C 166 220 206 200 252 200
         C 288 200 306 222 306 254"
      fill="none"
      stroke="url(#spiralGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
